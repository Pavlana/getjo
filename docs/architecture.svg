<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"
     aria-label="Data flow: Greenhouse, Lever and Ashby APIs are fetched by sources/greenhouse.py, sources/lever.py and sources/ashby.py via the shared core/http retry helper, normalised in jobs/radar.py alongside config from targets.toml and profile.toml, and deduplicated into SQLite by core/store.py. core/llm.py scores unscored matches against the CV, rubric and quote-checked dealbreakers with the Anthropic API, and core/notify.py sends jobs scoring 7 or more to Telegram.">
  <style>
    text { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1c1f24; }
    .subtitle, .arrow-label { font-family: "IBM Plex Sans", -apple-system, Helvetica, Arial, sans-serif; fill: #64707d; }
    .arrow-label { font-size: 11px; }
    line, polyline { stroke-width: 1.6; fill: none; }
    .edge-built { stroke: #2b6cb0; }
    rect.box-external { fill: #edf0f3; stroke: #9aa5b1; stroke-width: 1.3; }
    rect.box-built { fill: #ffffff; stroke: #2b6cb0; stroke-width: 1.6; }
    rect.box-hub { fill: #e8f0f9; stroke: #2b6cb0; stroke-width: 1.8; }
  </style>
  <rect x="0" y="0" width="1200" height="660" fill="#faf9f6" />
  <defs>
    <marker id="arrow-built" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Row A: external APIs -->
  <g class="edge-built">
    <line x1="465" y1="95" x2="465" y2="170" marker-end="url(#arrow-built)" />
    <line x1="755" y1="95" x2="755" y2="170" marker-end="url(#arrow-built)" />
    <line x1="1045" y1="95" x2="1045" y2="170" marker-end="url(#arrow-built)" />
  </g>
  <text class="arrow-label" x="465" y="135" text-anchor="middle">GET</text>
  <text class="arrow-label" x="755" y="135" text-anchor="middle">GET</text>
  <text class="arrow-label" x="1045" y="135" text-anchor="middle">GET</text>

  <rect class="box-external" x="340" y="40" width="250" height="55" rx="6" />
  <text x="465" y="73" text-anchor="middle" font-size="13" font-weight="600">Greenhouse Job Board API</text>

  <rect class="box-external" x="630" y="40" width="250" height="55" rx="6" />
  <text x="755" y="73" text-anchor="middle" font-size="13" font-weight="600">Lever Postings API</text>

  <rect class="box-external" x="920" y="40" width="250" height="55" rx="6" />
  <text x="1045" y="73" text-anchor="middle" font-size="13" font-weight="600">Ashby Job Board API</text>

  <!-- Row B: source modules -->
  <rect class="box-built" x="340" y="170" width="250" height="55" rx="6" />
  <text x="465" y="194" text-anchor="middle" font-size="13" font-weight="600">sources/greenhouse.py</text>
  <text class="subtitle" x="465" y="210" text-anchor="middle" font-size="10.5">via core/http.get_with_retry</text>

  <rect class="box-built" x="630" y="170" width="250" height="55" rx="6" />
  <text x="755" y="194" text-anchor="middle" font-size="13" font-weight="600">sources/lever.py</text>
  <text class="subtitle" x="755" y="210" text-anchor="middle" font-size="10.5">via core/http.get_with_retry</text>

  <rect class="box-built" x="920" y="170" width="250" height="55" rx="6" />
  <text x="1045" y="194" text-anchor="middle" font-size="13" font-weight="600">sources/ashby.py</text>
  <text class="subtitle" x="1045" y="210" text-anchor="middle" font-size="10.5">via core/http.get_with_retry</text>

  <!-- source -> radar -->
  <g class="edge-built">
    <line x1="465" y1="225" x2="465" y2="300" marker-end="url(#arrow-built)" />
    <line x1="755" y1="225" x2="755" y2="300" marker-end="url(#arrow-built)" />
    <line x1="1045" y1="225" x2="1045" y2="300" marker-end="url(#arrow-built)" />
  </g>
  <text class="arrow-label" x="465" y="266" text-anchor="middle">normalise</text>
  <text class="arrow-label" x="755" y="266" text-anchor="middle">normalise</text>
  <text class="arrow-label" x="1045" y="266" text-anchor="middle">normalise</text>

  <!-- config -->
  <rect class="box-built" x="20" y="300" width="280" height="70" rx="6" />
  <text x="160" y="326" text-anchor="middle" font-size="13" font-weight="600">targets.toml</text>
  <text x="160" y="344" text-anchor="middle" font-size="13" font-weight="600">profile.toml</text>
  <text class="subtitle" x="160" y="360" text-anchor="middle" font-size="10.5">local configuration</text>

  <g class="edge-built">
    <line x1="300" y1="335" x2="340" y2="335" marker-end="url(#arrow-built)" />
  </g>
  <text class="arrow-label" x="320" y="325" text-anchor="middle">reads</text>

  <!-- radar hub -->
  <rect class="box-hub" x="340" y="300" width="830" height="70" rx="6" />
  <text x="755" y="330" text-anchor="middle" font-size="15" font-weight="600">jobs/radar.py</text>
  <text class="subtitle" x="755" y="350" text-anchor="middle" font-size="11">fetch → normalise → filter (matches_filter)</text>

  <!-- radar -> store -->
  <g class="edge-built">
    <line x1="755" y1="370" x2="755" y2="420" marker-end="url(#arrow-built)" />
  </g>
  <text class="arrow-label" x="775" y="399" text-anchor="start">Job dicts → upsert(source:company:job_id)</text>

  <!-- store -->
  <rect class="box-built" x="535" y="420" width="440" height="60" rx="6" />
  <text x="755" y="448" text-anchor="middle" font-size="14" font-weight="600">core/store.py → data/jobs.db</text>
  <text class="subtitle" x="755" y="466" text-anchor="middle" font-size="10.5">SQLite — dedup by natural key</text>

  <!-- store -> notify (solid) -->
  <g class="edge-built">
    <polyline points="755,480 1005,560" marker-end="url(#arrow-built)" />
  </g>
  <text class="arrow-label" x="935" y="513" text-anchor="middle">score ≥ 7 only</text>

  <!-- store -> llm -->
  <g class="edge-built">
    <polyline points="755,480 505,560" marker-end="url(#arrow-built)" />
  </g>
  <text class="arrow-label" x="550" y="513" text-anchor="middle">unscored matches</text>

  <!-- llm.py -->
  <rect class="box-built" x="340" y="560" width="330" height="65" rx="6" />
  <text x="505" y="584" text-anchor="middle" font-size="13" font-weight="600">core/llm.py → Anthropic API</text>
  <text class="subtitle" x="505" y="601" text-anchor="middle" font-size="10.5">CV + rubric + quote-checked dealbreakers</text>
  <text class="subtitle" x="505" y="615" text-anchor="middle" font-size="10.5">Haiku 4.5 · score written back to store</text>

  <!-- notify -->
  <rect class="box-built" x="840" y="560" width="330" height="65" rx="6" />
  <text x="1005" y="584" text-anchor="middle" font-size="13" font-weight="600">core/notify.py → Telegram Bot API</text>
  <text class="subtitle" x="1005" y="601" text-anchor="middle" font-size="10.5">sends jobs scoring 7 or more</text>
  <text class="subtitle" x="1005" y="615" text-anchor="middle" font-size="10.5">→ Telegram chat</text>
</svg>
