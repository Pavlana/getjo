# Companies to watch. One [[company]] block each.
# Copy to config/targets.toml (gitignored) and fill in your own list.
# source: greenhouse | lever | ashby | workday | smartrecruiters | workable | amazon | eightfold  ("" if not yet known)
# board:  the name in the job board's web address, e.g. job-boards.greenhouse.io/<board>
#         Find it on the company's careers page (open any job; the URL shows the board and name).
#         Workday: "<tenant>.<wdN>/<site>" from <tenant>.<wdN>.myworkdayjobs.com/<site>, e.g. "exampleco.wd3/Careers".
#         Amazon: an ISO country code, e.g. "GBR". Eightfold: "<host>/<domain>", e.g. "apply.careers.microsoft.com/microsoft.com".
# search: optional, Workday and Eightfold (for Eightfold, a location such as "London, United Kingdom"). The site's own search text (e.g. "London"), for employers with more
#         postings than Workday will list (2,000); the run log warns when a target hits that cap.

[[company]]
name = "Example Co"
source = "greenhouse"
board = "exampleco"

[[company]]
name = "Another Co"
source = "lever"
board = "anotherco"

[[company]]
name = "Third Co"
source = "ashby"
board = "thirdco"
