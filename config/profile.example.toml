# What counts as a match. Copy to config/profile.toml (gitignored) and edit freely;
# the radar reads it on every run.

[filter]
# A title must name at least one of these, as whole words, case-insensitive ("rag" won't match "coverage")
title_include = ["engineer", "architect"]
# ...and none of these
title_exclude = ["intern", "internship", "graduate", "director"]
# Location terms match whole words, case-insensitive ("us" won't match "Australia").
# On-site or hybrid roles: the location must name one of these.
locations = ["london"]
# Remote roles: the location must say "remote" and name one of these.
# Leave empty to skip remote roles. US boards usually name the state ("Remote - Texas").
remote_places = ["united states", "us", "california", "new york", "europe", "united kingdom"]

[scoring]
model = "claude-haiku-4-5"            # cheap model for scoring; change and compare with evals
notify_threshold = 7                  # only scores >= this go to Telegram

# The rubric Claude uses. Plain language, one line per criterion.
rubric = [
  "The role's core work matches the skills in the CV",
  "Seniority level matches the candidate's experience",
  "Location and working pattern fit the candidate facts below",
]

# Facts stated by the candidate, given to the model as true so it doesn't guess them from the CV.
# Optional; leave empty for none.
candidate_facts = [
  "Based in London; not relocating",
  "Client travel is fine; assume a posting's travel is within the UK unless it names other countries",
]

# Hard rules, not preferences: if the posting clearly states one of these, the score is 3 or lower.
# Optional; leave empty for none.
dealbreakers = [
  "Requires speaking a language other than English",
]

# Optional: search Reed.co.uk across all employers (needs REED_API_KEY). Employers that are already
# targets with a readable board are skipped, so a job isn't found twice.
[reed]
keywords = ["AI engineer", "applied AI", "LLM engineer", "forward deployed engineer"]
location = "London"            # Reed searches within 10 miles of this place
direct_employers_only = true   # false adds recruitment-agency ads (often without the employer's name)
exclude_employers = ["Example Training Ltd"]

# Optional: read DevITjobs.uk (UK tech jobs; official RSS feed for descriptions, the site's job list
# for locations). No key needed. Employers that are targets with a readable board are skipped.
[devitjobs]
enabled = true
exclude_employers = []   # e.g. recruitment agencies, if they get too noisy
